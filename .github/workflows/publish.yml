# Build the package and publish it to PyPI with Trusted Publishing (no token).
# Runs when a version tag (e.g. v1.3.0) is pushed, or manually from the Actions tab.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nus-campus-weather
    permissions:
      id-token: write   # required for Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "pyproject version $v, tag $GITHUB_REF_NAME"
          test "v$v" = "$GITHUB_REF_NAME"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # re-running for a version already on PyPI is a no-op
